user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    client_header_timeout 5s;
    client_body_timeout 10s;

    # Cloudflare Real IP resolution
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Upstream directly to Next.js IPv4
    upstream nextjs_upstream {
        server 10.0.1.25:4444 max_fails=0;
        keepalive 128;
    }

    # Dedicated server block for esim.puresim.net (eSIM Installation Center)
    server {
        listen 8080;
        server_name esim.puresim.net;

        # Enforce HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Disable buffering to guarantee native Next.js streaming (no ERR_INVALID_RESPONSE)
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Is-RSC $http_rsc;
        proxy_set_header X-Next-Prefetch $http_next_router_prefetch;
        proxy_set_header X-Next-State $http_next_router_state_tree;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;

        # Convert permanent Next.js 308 redirects to standard SEO 301 redirects
        absolute_redirect off;
        proxy_intercept_errors on;
        error_page 308 = @redirect_301;
        location @redirect_301 {
            return 301 $upstream_http_location;
        }

        # 0. Instant Botnet Drop by signature (0.00ms)
        if ($http_user_agent ~* "151\.0\.0\.0") {
            return 403 "Forbidden\n";
        }

        # Sitemaps: dynamic from Next.js (max-age=3600, s-maxage=3600, no immutable)
        location ~* ^/sitemap.*\.xml$ {
            proxy_pass http://nextjs_upstream;
        }

        # Static Assets & Images (PNG, JPG, ICO, SVG, WEBP, CSS, JS, Fonts, TXT, JSON)
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|txt|json)$ {
            proxy_pass http://nextjs_upstream;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header Access-Control-Allow-Origin "*";
        }

        # Fast-drop probes
        location ~ \.(php|env|git|sql|bak|asp|aspx)$ {
            return 404 "Not Found\n";
        }

        # Pass all valid requests for the installation subdomain directly to Next.js
        location / {
            proxy_pass http://nextjs_upstream;
        }
    }

    # Main store / Default server block (puresim.net & www.puresim.net)
    server {
        listen 8080 default_server;
        server_name _;

        # Enforce HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Disable buffering to guarantee native Next.js streaming (no ERR_INVALID_RESPONSE)
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Is-RSC $http_rsc;
        proxy_set_header X-Next-Prefetch $http_next_router_prefetch;
        proxy_set_header X-Next-State $http_next_router_state_tree;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;

        # Convert permanent Next.js 308 redirects to standard SEO 301 redirects
        absolute_redirect off;
        proxy_intercept_errors on;
        error_page 308 = @redirect_301;
        location @redirect_301 {
            return 301 $upstream_http_location;
        }

        # 0. Instant Botnet Drop by signature (0.00ms)
        if ($http_user_agent ~* "151\.0\.0\.0") {
            return 403 "Forbidden\n";
        }

        # 1. Exact Root / Homepage
        location = / {
            proxy_pass http://nextjs_upstream;
        }

        # 2a. Sitemaps: dynamic from Next.js (max-age=3600, s-maxage=3600, no immutable)
        location ~* ^/sitemap.*\.xml$ {
            proxy_pass http://nextjs_upstream;
        }

        # 2b. Static Assets & Images (PNG, JPG, ICO, SVG, WEBP, CSS, JS, Fonts, TXT, JSON)
        # Force cache-control public, 30 days so Cloudflare and browsers cache them immediately
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|txt|json)$ {
            proxy_pass http://nextjs_upstream;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header Access-Control-Allow-Origin "*";
        }

        # 3. Whitelist of all legitimate store routes & Next.js internals
        location /_next/ { proxy_pass http://nextjs_upstream; }
        location /api/ { proxy_pass http://nextjs_upstream; }
        location /esim { proxy_pass http://nextjs_upstream; }
        location /de { proxy_pass http://nextjs_upstream; }
        location /en { proxy_pass http://nextjs_upstream; }
        location /fr { proxy_pass http://nextjs_upstream; }
        location /es { proxy_pass http://nextjs_upstream; }
        location /it { proxy_pass http://nextjs_upstream; }
        location /nl { proxy_pass http://nextjs_upstream; }
        location /pl { proxy_pass http://nextjs_upstream; }
        location /pt { proxy_pass http://nextjs_upstream; }
        location /tr { proxy_pass http://nextjs_upstream; }
        location /sv { proxy_pass http://nextjs_upstream; }
        location /da { proxy_pass http://nextjs_upstream; }
        location /fi { proxy_pass http://nextjs_upstream; }
        location /cs { proxy_pass http://nextjs_upstream; }
        location /ro { proxy_pass http://nextjs_upstream; }
        location /hu { proxy_pass http://nextjs_upstream; }
        location /tariffs { proxy_pass http://nextjs_upstream; }
        location /unlimited { proxy_pass http://nextjs_upstream; }
        location /faq { proxy_pass http://nextjs_upstream; }
        location /s { proxy_pass http://nextjs_upstream; }
        location /configurator { proxy_pass http://nextjs_upstream; }
        location /cart { proxy_pass http://nextjs_upstream; }
        location /checkout { proxy_pass http://nextjs_upstream; }
        location /order { proxy_pass http://nextjs_upstream; }
        location /topup { proxy_pass http://nextjs_upstream; }
        location /reviews { proxy_pass http://nextjs_upstream; }
        location /login { proxy_pass http://nextjs_upstream; }
        location /register { proxy_pass http://nextjs_upstream; }
        location /auth { proxy_pass http://nextjs_upstream; }
        location /dashboard { proxy_pass http://nextjs_upstream; }
        location /blog { proxy_pass http://nextjs_upstream; }
        location /esim-overview { proxy_pass http://nextjs_upstream; }
        location /agb { proxy_pass http://nextjs_upstream; }
        location /datenschutz { proxy_pass http://nextjs_upstream; }
        location /refund-policy { proxy_pass http://nextjs_upstream; }
        location /ai { proxy_pass http://nextjs_upstream; }
        location /success { proxy_pass http://nextjs_upstream; }
        location /sitemap { proxy_pass http://nextjs_upstream; }
        location /robots { proxy_pass http://nextjs_upstream; }
        location /favicon { proxy_pass http://nextjs_upstream; }
        location /icon { proxy_pass http://nextjs_upstream; }
        location /logo { proxy_pass http://nextjs_upstream; }

        # 3b. eSIM Installation & Direct URLs (e.g. /<invoiceId>/<iccid>)
        location ~ ^/[a-zA-Z0-9_-]+/[0-9]+ {
            proxy_pass http://nextjs_upstream;
        }

        # 4. Fast-drop probes
        location ~ \.(php|env|git|sql|bak|asp|aspx)$ {
            return 404 "Not Found\n";
        }

        # 5. Pass unhandled paths to Next.js catchall 404 handler
        location / {
            proxy_pass http://nextjs_upstream;
        }
    }
}
