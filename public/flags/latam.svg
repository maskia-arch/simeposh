<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="640" height="480" rx="24" fill="url(#bgGrad)"/>
  <!-- Decorative Longitude / Latitude subtle grid -->
  <circle cx="320" cy="240" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <ellipse cx="320" cy="240" rx="90" ry="180" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  <line x1="140" y1="240" x2="500" y2="240" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <!-- Stylized silhouette of Central & South America -->
  <g filter="url(#shadow)" fill="url(#landGrad)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round">
    <!-- Mexico / Central America isthmus bridge -->
    <path d="M228 152 c12 -8 26 -4 36 2 c8 5 18 10 24 18 c5 7 14 12 22 14 c8 2 15 8 18 16 c-4 3 -8 4 -12 2 c-8 -4 -16 -8 -24 -11 c-10 -4 -20 -9 -30 -16 c-12 -9 -22 -16 -34 -25 z"/>
    <!-- South America continent body -->
    <path d="M312 202 c16 -6 38 -4 54 4 c18 9 36 14 54 22 c16 7 28 22 32 38 c4 18 0 38 -8 54 c-10 22 -22 42 -32 64 c-14 30 -26 62 -42 90 c-6 10 -12 18 -20 26 c-6 6 -12 4 -16 -2 c-6 -10 -4 -24 -4 -36 c0 -28 4 -56 2 -84 c-2 -22 -8 -44 -16 -64 c-6 -16 -16 -30 -22 -46 c-6 -18 -8 -36 -2 -54 c4 -6 10 -10 20 -12 z"/>
    <!-- Caribbean Islands accents -->
    <ellipse cx="356" cy="188" rx="14" ry="4" transform="rotate(-12 356 188)"/>
    <circle cx="382" cy="196" r="3.5"/>
    <circle cx="396" cy="204" r="3"/>
  </g>
</svg>
