<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <!-- Red field with gold border -->
  <rect width="1200" height="600" fill="#c8102e"/>
  <rect x="15" y="15" width="1170" height="570" fill="none" stroke="#d4af37" stroke-width="30"/>
  
  <!-- Central Emblem: Double-headed Golden Eagle -->
  <g transform="translate(600 300) scale(1.35)" fill="#d4af37" stroke="#b89025" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tail feathers -->
    <path d="M-30 85 C-35 115 -15 135 0 140 C15 135 35 115 30 85 C15 95 -15 95 -30 85 Z" fill="#d4af37" stroke-width="2"/>
    <path d="M-22 92 L-30 128 L-15 133 L-10 95 Z M22 92 L30 128 L15 133 L10 95 Z M-5 96 L0 138 L5 96 Z" fill="#e5c158" stroke-width="1.5"/>

    <!-- Left Wing -->
    <path d="M-35 20 C-60 0 -95 -30 -140 -50 C-155 -55 -165 -35 -150 -20 C-130 0 -95 35 -75 70 C-90 60 -125 35 -135 48 C-145 60 -125 78 -105 92 C-115 90 -130 88 -132 100 C-134 112 -112 118 -90 115 C-70 112 -50 90 -35 75 Z" fill="#d4af37" stroke-width="3"/>
    <path d="M-55 15 C-80 -5 -115 -25 -145 -38 M-50 35 C-75 25 -105 20 -128 42 M-45 55 C-65 52 -95 62 -108 80" fill="none" stroke="#b89025" stroke-width="2"/>

    <!-- Right Wing -->
    <path d="M35 20 C60 0 95 -30 140 -50 C155 -55 165 -35 150 -20 C130 0 95 35 75 70 C90 60 125 35 135 48 C145 60 125 78 105 92 C115 90 130 88 132 100 C134 112 112 118 90 115 C70 112 50 90 35 75 Z" fill="#d4af37" stroke-width="3"/>
    <path d="M55 15 C80 -5 115 -25 145 -38 M50 35 C75 25 105 20 128 42 M45 55 C65 52 95 62 108 80" fill="none" stroke="#b89025" stroke-width="2"/>

    <!-- Left Leg & Claws holding Sceptre -->
    <path d="M-45 75 C-55 85 -60 100 -50 112 C-45 118 -38 115 -42 105 Z" fill="#d4af37" stroke-width="2"/>
    <!-- Sceptre -->
    <g transform="translate(-62 82) rotate(-35)">
      <line x1="0" y1="-45" x2="0" y2="45" stroke="#e5c158" stroke-width="6"/>
      <circle cx="0" cy="-48" r="9" fill="#e5c158" stroke="#b89025" stroke-width="2"/>
      <path d="M-6 -48 L6 -48 M0 -54 L0 -42" stroke="#b89025" stroke-width="2"/>
      <circle cx="0" cy="46" r="5" fill="#e5c158" stroke-width="2"/>
    </g>

    <!-- Right Leg & Claws holding Globus Cruciger (Orb) -->
    <path d="M45 75 C55 85 60 100 50 112 C45 118 38 115 42 105 Z" fill="#d4af37" stroke-width="2"/>
    <!-- Globus Cruciger (Blue orb with golden cross) -->
    <g transform="translate(68 92)">
      <circle cx="0" cy="0" r="16" fill="#1b4d89" stroke="#d4af37" stroke-width="3"/>
      <path d="M-16 0 L16 0 M0 -16 L0 16" fill="none" stroke="#d4af37" stroke-width="3"/>
      <path d="M-5 -21 L5 -21 M0 -26 L0 -16" stroke="#d4af37" stroke-width="3"/>
    </g>

    <!-- Left Neck & Head -->
    <path d="M-18 20 C-22 -10 -30 -35 -40 -50 C-46 -58 -38 -68 -28 -66 C-18 -64 -15 -45 -10 -25 Z" fill="#d4af37" stroke-width="2"/>
    <!-- Left Beak & Tongue -->
    <path d="M-38 -56 L-56 -52 L-36 -46 Z" fill="#d4af37" stroke-width="1.5"/>
    <path d="M-42 -50 L-50 -48" stroke="#c8102e" stroke-width="2"/>
    <circle cx="-32" cy="-55" r="2.5" fill="#1b4d89" stroke="none"/>
    <!-- Left Crown -->
    <path d="M-42 -66 L-44 -74 L-36 -70 L-28 -74 L-30 -66 Z" fill="#e5c158" stroke="#b89025" stroke-width="1.5"/>

    <!-- Right Neck & Head -->
    <path d="M18 20 C22 -10 30 -35 40 -50 C46 -58 38 -68 28 -66 C18 -64 15 -45 10 -25 Z" fill="#d4af37" stroke-width="2"/>
    <!-- Right Beak & Tongue -->
    <path d="M38 -56 L56 -52 L36 -46 Z" fill="#d4af37" stroke-width="1.5"/>
    <path d="M42 -50 L50 -48" stroke="#c8102e" stroke-width="2"/>
    <circle cx="32" cy="-55" r="2.5" fill="#1b4d89" stroke="none"/>
    <!-- Right Crown -->
    <path d="M42 -66 L44 -74 L36 -70 L28 -74 L30 -66 Z" fill="#e5c158" stroke="#b89025" stroke-width="1.5"/>

    <!-- Large Central Imperial Crown above heads -->
    <g transform="translate(0 -78) scale(0.95)">
      <path d="M-22 0 C-25 -18 -15 -25 0 -28 C15 -25 25 -18 22 0 Z" fill="#d4af37" stroke="#b89025" stroke-width="2"/>
      <path d="M-24 0 L-28 -14 L-14 -8 L0 -18 L14 -8 L28 -14 L24 0 Z" fill="#e5c158" stroke="#b89025" stroke-width="1.5"/>
      <circle cx="0" cy="-32" r="3.5" fill="#e5c158" stroke="#b89025" stroke-width="1.5"/>
      <path d="M-4 -32 L4 -32 M0 -36 L0 -28" stroke="#b89025" stroke-width="1.5"/>
      <circle cx="-16" cy="-2" r="2" fill="#c8102e" stroke="none"/>
      <circle cx="0" cy="-3" r="2.5" fill="#1b4d89" stroke="none"/>
      <circle cx="16" cy="-2" r="2" fill="#c8102e" stroke="none"/>
    </g>

    <!-- Breast Shield (Inescutcheon) -->
    <g transform="translate(0 35)">
      <!-- Shield Body -->
      <path d="M-30 -30 L30 -30 L30 10 C30 35 15 50 0 58 C-15 50 -30 35 -30 10 Z" fill="#1b4d89" stroke="#d4af37" stroke-width="4"/>
      <!-- Green base / ground -->
      <path d="M-28 15 C-15 12 15 12 28 15 L28 16 C25 35 12 48 0 54 C-12 48 -25 35 -28 16 Z" fill="#2d682a" stroke="#d4af37" stroke-width="2"/>
      <!-- Gold Lion Passant -->
      <g transform="translate(-2 18) scale(0.7)">
        <!-- Lion body and head -->
        <path d="M-22 -8 C-18 -15 -8 -22 2 -18 C12 -22 18 -12 22 -5 C18 -2 15 8 8 10 C-5 12 -15 8 -22 -8 Z" fill="#e5c158" stroke="#b89025" stroke-width="1.5"/>
        <!-- Mane and Head -->
        <circle cx="16" cy="-14" r="7" fill="#e5c158" stroke="#b89025" stroke-width="1.5"/>
        <path d="M22 -14 L27 -12 L22 -9 Z" fill="#e5c158" stroke-width="1"/>
        <!-- Forepaw raised -->
        <path d="M12 -4 L20 -6 L24 2 M6 -2 L12 8" stroke="#e5c158" stroke-width="3" stroke-linecap="round"/>
        <!-- Hind legs -->
        <path d="M-14 0 L-18 10 M-8 2 L-10 10" stroke="#e5c158" stroke-width="3" stroke-linecap="round"/>
        <!-- Lion tail curved over back -->
        <path d="M-18 -6 C-24 -14 -22 -24 -15 -25 C-10 -26 -12 -20 -16 -18" fill="none" stroke="#e5c158" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>